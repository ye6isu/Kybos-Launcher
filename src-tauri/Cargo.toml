[package]
name = "kybos-launcher"
version = "0.1.0"
description = "Kybos Launcher - Lightweight, editorial Minecraft launcher"
authors = ["yebisu"]
edition = "2024"

[lib]
name = "kybos_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1.0"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
zip = { version = "9.8.2", features = ["deflate"] }
tokio-stream = "0.1.19"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
